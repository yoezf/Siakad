; Pengaturan PHP khusus server lokal (php artisan serve), dipakai lewat jalankan-lokal.bat (variabel PHP_INI_SCAN_DIR).
; php.ini milik sistem tidak diubah. Untuk server produksi, atur nilai setara di PHP-FPM.

; Tanpa OPcache setiap permintaan mengompilasi ulang seluruh Laravel dan Filament (sekitar 1 detik per halaman).
zend_extension=opcache
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Foto dari HP biasanya 3-8 MB (bawaan PHP hanya 2 MB) dan butuh banyak memori saat diolah (12 megapiksel = sekitar 48 MB per salinan).
upload_max_filesize=12M
post_max_size=16M
memory_limit=512M
